<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tumpeng Menu - Cheche Catering</title>
  <link rel="stylesheet" href="tumpeng.css" />
  <link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="navbar-left">
      <button class="home-btn" onclick="location.href='home.html'">
        <img src="image/back.svg" alt="Home" class="home-icon" />
      </button>
    </div>
    <div class="navbar-right">
      <img src="image/logo.png" alt="Logo" class="navbar-logo" />
    </div>
  </header>

  <!-- Menu and Gallery -->
  <section class="menu-box">
    <div class="left-text">
      <h2><span class="highlight">Our Menu</span> – <span class="box-title">Tumpeng</span></h2>
      <ul class="menu-list">
        <li><a href="pakettumpeng.html">Paket Tumpeng</a></li>
        <li><a href="pkttumpengmini.html">Tumpeng Mini</a></li>
      </ul>
    </div>
    <div class="right-gallery">
      <div class="image-collage">
        <img src="image/tumpeng 2.jpg" class="collage-img img-1" alt="Paket Tumpeng 1">
        <img src="image/tumpngg.jpg" class="collage-img img-2" alt="Paket Tumpeng 2">
        <img src="image/tumpeng 3.jpg" class="collage-img img-3" alt="Paket Tumpeng 3">
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <img src="image/logo.png" alt="Footer Logo" class="footer-logo">
    <p>&copy; 2025, Che-Che Catering. All rights reserved</p>
  </footer>

  <script>
    const images = document.querySelectorAll('.gallery-img');
    const container = document.querySelector('.image-container');
    let current = 0;
    let interval;

    function startSlideshow() {
      interval = setInterval(() => {
        images[current].classList.remove('active');
        current = (current + 1) % images.length;
        images[current].classList.add('active');
      }, 2000);
    }

    function stopSlideshow() {
      clearInterval(interval);
    }

    function showImage(index) {
      stopSlideshow();
      images.forEach((img, i) => {
        img.classList.toggle('active', i === index);
      });
      current = index;
    }

    container.addEventListener('mouseenter', startSlideshow);
    container.addEventListener('mouseleave', stopSlideshow);
  </script>
</body>
</html>
